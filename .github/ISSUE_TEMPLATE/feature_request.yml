name: Feature request
description: Propose a new capability or a change to the API.
title: "[feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Proposals are discussed before code is written, so the API stays small and consistent. For open-ended ideas, a discussion may be a better start.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that GeorgNative does not allow today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed request and result
      description: The method name, its params and its result, following docs/api.md.
      render: json
    validations:
      required: false

  - type: input
    id: framework
    attributes:
      label: Apple framework involved
      placeholder: Vision, FoundationModels, Speech…
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself
