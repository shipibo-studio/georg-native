name: Bug report
description: Report unexpected behavior or an error.
title: "[bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include personal data, private documents or secrets: if a file is needed to reproduce the bug, share a minimal synthetic one.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happens? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Request and result
      description: The request JSON you submitted and the result or error you received.
      render: json
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Submit '...'
        2. Poll for the result
        3. See the error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GeorgNative version or commit
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.1, MacBook Pro M3
    validations:
      required: true

  - type: dropdown
    id: apple-intelligence
    attributes:
      label: Apple Intelligence
      options:
        - Enabled
        - Disabled
        - Not available on this Mac
        - Not relevant to this bug
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Host runtime
      placeholder: tinyjs 0.57, Bun 1.3, Node 24 with koffi…
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs (without user content), screenshots or anything else that helps.
    validations:
      required: false
